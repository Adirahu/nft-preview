<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="stylesheet" href="nft.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,600;1,14..32,600&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <main>
        <div class="card">
            <div class="card__image">
                <img src="c:\Users\hermano\Downloads\nft-preview-card-component-main\images\image-equilibrium.jpg" alt="Equilibrium" class="card__image--img">
                <div class="card__image--overlay">
                    <img src="c:\Users\hermano\Downloads\nft-preview-card-component-main\images\icon-view.svg" alt="View Icon" class="card__image--icon">
                </div>
            </div>
            <div class="card__content">
                <h1 class="card__content--title">Equilibrium #3429</h1>
                <p class="card__content--description">Our Equilibrium collection promotes balance and calm.</p>
                <div class="card__content--info">
                    <div class="card__content--price">
                        <img src="c:\Users\hermano\Downloads\nft-preview-card-component-main\images\icon-ethereum.svg" alt="Ethereum Icon" class="card__content--price-icon">
                        <span>0.041 ETH</span>
                    </div>
                    <div class="card__content--time">
                        <img src="c:\Users\hermano\Downloads\nft-preview-card-component-main\images\icon-clock.svg" alt="Clock Icon" class="card__content--time-icon">
                        <span>3 days left</span>
                    </div>
                </div>
                <hr class="card__content--divider">
                <div class="card__content--creator">
                    <img src="c:\Users\hermano\Downloads\nft-preview-card-component-main\images\image-avatar.png" alt="Creator Avatar" class="card__content--creator-avatar">
                    <p>Creation of <span>Jules Wyvern</span></p>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
